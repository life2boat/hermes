name: HealBite Secret Remediation R1 Safety

on:
  push:
    branches:
      - 'antigravity/healbite-secret-remediation-r1-tooling'
    paths:
      - 'ops/secret_remediation_r1/**'
      - 'tests/secret_remediation_r1/**'
      - '.github/workflows/secret-remediation-r1-safety.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ops/secret_remediation_r1/**'
      - 'tests/secret_remediation_r1/**'
      - '.github/workflows/secret-remediation-r1-safety.yml'

permissions:
  contents: read

concurrency:
  group: secret-remediation-r1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-safety-tests:
    name: Linux Safety Tests (Python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Run focused Linux safety tests
        run: |
          uv run pytest tests/secret_remediation_r1 \
            -v \
            --tb=short \
            --no-header \
            -p no:cacheprovider \
            --strict-markers \
            -x

      - name: Static anti-placeholder check
        run: |
          python scripts/check_secret_remediation_placeholders.py
