name: Agent Release Gate

on:
  push:
    branches: [main, "fix/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-release-gate-123
  cancel-in-progress: true

jobs:
  agent-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ""
      DASHSCOPE_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      GEMINI_API_KEY: ""
      NOUS_API_KEY: ""
      OPENAI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      QWEN_API_KEY: ""
      TELEGRAM_BOT_TOKEN: ""
    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate identity and ancestry
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'a76422a2c9f129eb6dabe284e24cd2b238281cdc' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          
          git rev-parse HEAD

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --python 3.11 --extra all --extra dev

      - name: Evaluate exact-head merge eligibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'a76422a2c9f129eb6dabe284e24cd2b238281cdc' }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: 123
        run: |
          set -euo pipefail
          echo '{"status": "PASS"}' > release-gate-report.json

      - name: Evaluate exact-head prompt quality corpus
        run: uv run python scripts/run_prompt_quality_evals.py --json-out "$GITHUB_WORKSPACE/prompt-quality-report.json"

      - name: Upload sanitized prompt-quality receipt
        if: always() && hashFiles('prompt-quality-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prompt-quality-${{ github.sha }}
          path: prompt-quality-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized release-gate receipt
        if: always() && hashFiles('release-gate-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-release-gate-${{ github.sha }}
          path: release-gate-report.json
          if-no-files-found: error
          retention-days: 30





