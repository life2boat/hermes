name: Production Runtime Attestation Contract

on:
  pull_request:
    paths:
      - ".github/workflows/production-runtime-attestation.yml"
      - "ai_engineering/production_runtime_attestation.py"
      - "docs/PRODUCTION_RUNTIME_ATTESTATION_V1.md"
      - "schemas/production-runtime-attestation-v1.schema.json"
      - "scripts/production_runtime_attestation.py"
      - "tests/fixtures/production_runtime_attestation/**"
      - "tests/test_production_runtime_attestation.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-runtime-attestation.yml"
      - "ai_engineering/production_runtime_attestation.py"
      - "docs/PRODUCTION_RUNTIME_ATTESTATION_V1.md"
      - "schemas/production-runtime-attestation-v1.schema.json"
      - "scripts/production_runtime_attestation.py"
      - "tests/fixtures/production_runtime_attestation/**"
      - "tests/test_production_runtime_attestation.py"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check out exact pushed revision
        if: github.event_name != 'pull_request'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Verify checked-out revision
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1)"

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install locked Python environment
        shell: bash
        run: |
          uv python install 3.11
          uv sync --locked --python 3.11 --extra all --extra dev

      - name: Validate ProductionRuntimeAttestation v1
        shell: bash
        run: |
          uv run python -m pytest -q tests/test_production_runtime_attestation.py
          uv run python -m py_compile ai_engineering/production_runtime_attestation.py scripts/production_runtime_attestation.py
          uv run python -m json.tool schemas/production-runtime-attestation-v1.schema.json >/dev/null
