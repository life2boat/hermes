name: Healbite exact-main GHCR image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: healbite-exact-main-ghcr-${{ github.ref }}
  cancel-in-progress: false

env:
  APPROVED_BASE_SHA: 8b44bb146b31902dc99c53d976e7b20964eb4caa
  CLOSURE_MANIFEST_SHA256: a685b3d071968d5140ce42f8346246b0857167c90eefdde71b6ff011eb97340f
  REGISTRY_IMAGE: ghcr.io/life2boat/hermes
  SOURCE_URL: https://github.com/life2boat/hermes

jobs:
  build:
    if: github.repository == 'life2boat/hermes' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact dispatch SHA
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact canonical main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git remote get-url origin)" = "https://github.com/life2boat/hermes"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          git diff --check

      - name: Scan exact source candidates
        shell: bash
        run: bash scripts/secret_check.sh

      - name: Materialize reviewed Playwright closure
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.prepare_remote_playwright_artifacts \
            --policy deploy/playwright-remote-build-artifacts.json \
            --lockfile uv.lock \
            --output "$RUNNER_TEMP/playwright-artifacts"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push exact-main image once
        shell: bash
        run: |
          set -euo pipefail
          python3 -m scripts.build_verified_playwright_image build-push \
            --expected-source-sha "$GITHUB_SHA" \
            --approved-base-sha "$APPROVED_BASE_SHA" \
            --artifact-context "$RUNNER_TEMP/playwright-artifacts" \
            --expected-closure-manifest-sha256 "$CLOSURE_MANIFEST_SHA256" \
            --image-tag "$REGISTRY_IMAGE:sha-$GITHUB_SHA" \
            --platform linux/amd64 \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            --receipt "$RUNNER_TEMP/build-receipt.json"

      - name: Inspect and attest registry digest
        id: attest
        shell: bash
        run: |
          set -euo pipefail
          digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["registry_digest"])' "$RUNNER_TEMP/build-receipt.json")"
          reference="$REGISTRY_IMAGE@$digest"
          docker buildx imagetools inspect "$reference" --raw > "$RUNNER_TEMP/manifest.json"
          docker buildx imagetools inspect "$reference" --format '{{json .Image}}' > "$RUNNER_TEMP/config.json"
          python3 -m scripts.attest_remote_registry_image \
            --manifest "$RUNNER_TEMP/manifest.json" \
            --config "$RUNNER_TEMP/config.json" \
            --receipt "$RUNNER_TEMP/build-receipt.json" \
            --expected-digest "$digest" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-source-url "$SOURCE_URL" \
            --expected-platform linux/amd64 \
            --output "$RUNNER_TEMP/registry-attestation.json"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image=$REGISTRY_IMAGE@$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$REGISTRY_IMAGE:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Materialize and capture exact immutable image scan
        id: image_scan
        shell: bash
        run: |
          set -euo pipefail
          reference="${{ steps.attest.outputs.image }}"
          receipt="$RUNNER_TEMP/image-secret-attestation.json"
          docker pull "$reference"
          set +e
          python3 -m scripts.hermes_image_secret_scan \
            --repository-root "$GITHUB_WORKSPACE" \
            --image "$reference" \
            --expected-source-sha "$GITHUB_SHA" \
            --output "$receipt" >/dev/null
          scanner_rc="$?"
          set -e
          digest="${reference##*@}"
          jq -e \
            --argjson rc "$scanner_rc" \
            --arg digest "$digest" \
            '.RECEIPT_VERSION == 1
             and .SCANNER_EXIT_CODE == $rc
             and .IMAGE_DIGEST == $digest
             and (.STATUS == "PASS" or .STATUS == "FAIL")
             and (.SCANNER_ERROR_CLASS == "NONE"
                  or .SCANNER_ERROR_CLASS == "FINDING"
                  or .SCANNER_ERROR_CLASS == "PARSE_ERROR"
                  or .SCANNER_ERROR_CLASS == "IO_ERROR"
                  or .SCANNER_ERROR_CLASS == "ASSERTION_ERROR"
                  or .SCANNER_ERROR_CLASS == "CONTRACT_ERROR"
                  or .SCANNER_ERROR_CLASS == "INTERNAL_ERROR")
             and (.SCANNER_ERROR_CODE == null
                  or (.SCANNER_ERROR_CODE | test("^[A-Z0-9_]+$")))
             and (.FINDING_COUNT == null
                  or ((.FINDING_COUNT | type) == "number"
                      and .FINDING_COUNT >= 0
                      and (.FINDING_COUNT | floor) == .FINDING_COUNT))
             and (.FINDING_CLASS | type) == "array"
             and all(.FINDING_CLASS[];
                     . == "PRIVATE_KEY_MATERIAL"
                     or . == "PROTECTED_SECRET_MATERIAL"
                     or . == "KNOWN_PROVIDER_CREDENTIAL"
                     or . == "HIGH_ENTROPY_CREDENTIAL"
                     or . == "CREDENTIAL_IN_URL")
             and (.FINDING_LOCATION | type) == "array"
             and all(.FINDING_LOCATION[];
                     (.scope == "metadata" or .scope == "layer")
                     and (.path_sha256 | test("^[0-9a-f]{64}$"))
                     and (.layer_digest == null
                          or (.layer_digest | test("^sha256:[0-9a-f]{64}$"))))
             and (.SCAN_POLICY_SHA256 | test("^[0-9a-f]{64}$"))
             and (if $rc == 0
                  then .STATUS == "PASS" and .SCANNER_ERROR_CLASS == "NONE"
                  else .STATUS == "FAIL"
                  end)' \
            "$receipt" >/dev/null
          echo "scanner_exit_code=$scanner_rc" >> "$GITHUB_OUTPUT"
          echo "receipt_safe=true" >> "$GITHUB_OUTPUT"

      - name: Upload safe registry attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && steps.image_scan.outputs.receipt_safe == 'true' }}
        with:
          name: exact-main-registry-attestation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build-receipt.json
            ${{ runner.temp }}/registry-attestation.json
            ${{ runner.temp }}/image-secret-attestation.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce exact image secret scan gate
        id: image_scan_gate
        if: ${{ always() && steps.image_scan.outputs.receipt_safe == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.image_scan.outputs.scanner_exit_code }}" -eq 0
          expected_id="$(jq -er '.config_digest' "$RUNNER_TEMP/registry-attestation.json")"
          expected_digest="${{ steps.attest.outputs.digest }}"
          jq -e \
            --arg id "$expected_id" \
            --arg digest "$expected_digest" \
            --arg revision "$GITHUB_SHA" \
            '.STATUS == "PASS"
             and .SCANNER_EXIT_CODE == 0
             and .SCANNER_ERROR_CLASS == "NONE"
             and .SCANNER_ERROR_CODE == null
             and .FINDING_COUNT == 0
             and .FINDING_CLASS == []
             and .FINDING_LOCATION == []
             and .IMAGE_DIGEST == $digest
             and .IMAGE_ID == $id
             and .IMAGE_OCI_REVISION == $revision
             and .IMAGE_SECRET_FINDINGS == 0
             and .IMAGE_METADATA_SECRET_FINDINGS == 0
             and .IMAGE_LAYER_SECRET_FINDINGS == 0
             and .IMAGE_FINAL_FILESYSTEM_SECRET_FINDINGS == 0
             and .LAYERS_SCANNED > 0
             and (.SCAN_POLICY_SHA256 | test("^[0-9a-f]{64}$"))' \
            "$RUNNER_TEMP/image-secret-attestation.json" >/dev/null
          echo "layers=$(jq -er '.LAYERS_SCANNED' "$RUNNER_TEMP/image-secret-attestation.json")" >> "$GITHUB_OUTPUT"
          echo "files=$(jq -er '.FILES_SCANNED' "$RUNNER_TEMP/image-secret-attestation.json")" >> "$GITHUB_OUTPUT"
          echo "bytes=$(jq -er '.BYTES_SCANNED' "$RUNNER_TEMP/image-secret-attestation.json")" >> "$GITHUB_OUTPUT"

      - name: Publish safe summary
        shell: bash
        run: |
          {
            echo "REMOTE_BUILD_HOST=github-hosted-ubuntu"
            echo "REMOTE_BUILD_COUNT=1"
            echo "REMOTE_BUILD_RETRY_COUNT=0"
            echo "FINAL_BUILD_SOURCE_SHA=$GITHUB_SHA"
            echo "REGISTRY_IMAGE_REFERENCE=${{ steps.attest.outputs.image }}"
            echo "REGISTRY_IMAGE_DIGEST=${{ steps.attest.outputs.digest }}"
            echo "IMMUTABLE_SHA_TAG=${{ steps.attest.outputs.tag }}"
            echo "PRODUCTION_SECRETS_USED_AS_BUILD_ARGS=false"
            echo "IMAGE_METADATA_HISTORY_SECRET_FINDINGS=0"
            echo "IMAGE_SECRET_FINDINGS=0"
            echo "IMAGE_LAYERS_SCANNED=${{ steps.image_scan_gate.outputs.layers }}"
            echo "IMAGE_FILES_SCANNED=${{ steps.image_scan_gate.outputs.files }}"
            echo "IMAGE_BYTES_SCANNED=${{ steps.image_scan_gate.outputs.bytes }}"
          } >> "$GITHUB_STEP_SUMMARY"
